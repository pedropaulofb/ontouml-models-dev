editorialNote: >-
  The ontology was developed from IEC 61508:2010 and grounded in UFO using OntoUML.
  HO61508 provides an abstract, modular representation of hazard-related concepts
  intended for reuse and extension in domain-specific safety ontologies. The
  published ontology was evaluated for completeness, clarity, accuracy, and
  conciseness, and its adaptability was demonstrated through the hydrogen-specific
  extension H2HO. The editable OntoUML representation includes refinements to the
  original published diagram while retaining its conceptual interpretation.
